#--------------------------------地址配置------------------------------#
#管理kafka地址
source.kafka.servers=192.168.44.12:9094

#管理输出kafka地址
sink.kafka.servers=192.168.44.12:9094

#用于分配log_id、连接hbase的zookeeper地址
zookeeper.servers=192.168.44.85:2181,192.168.44.86:2181,192.168.44.87:2181

#连接hdfs（knowledgebase.file.system.type配置为hdfs才会连接）的zookeeper地址
hdfs.zookeeper.servers=192.168.44.85:2181,192.168.44.86:2181,192.168.44.87:2181

#hdfs地址用于获取定位库
hdfs.servers=192.168.44.85:9000,192.168.44.86:9000

#--------------------------------HTTP/定位库------------------------------#
#hos token 加密
#hos.token=ffc1c7b42f414102b206e2a4316c55d3
hos.token=vknRT6U4I739rLIha9CvojM+4uFyXZLEYpO2HZayLnRak1HPW0K2yZ3vnQBA2foo

#定位库存储文件系统类型，hdfs or local
knowledgebase.file.system.type=local

#定位库地址，根据file.system.type配置填写对应地址路径。
#knowledgebase.library=/knowledgebase/ETL-SESSION-RECORD-COMPLETED/
knowledgebase.library=D:\\workerspace\\dat\\test\\

#工具库地址，存放秘钥文件等。
tools.library=D:\\workerspace\\dat\\test\\

#--------------------------------nacos配置------------------------------#
#nacos 地址
nacos.server=192.168.44.12:8848

#schema namespace名称
nacos.schema.namespace=prod

#schema data id名称
nacos.schema.data.id=session_record.json

#knowledgebase namespace名称
nacos.knowledgebase.namespace=public

#knowledgebase data id名称
nacos.knowledgebase.data.id=knowledge_base.json

#--------------------------------Kafka消费/生产配置------------------------------#

#kafka 接收数据topic
source.kafka.topic=test

#补全数据 输出 topic
sink.kafka.topic=test-result

#读取topic,存储该spout id的消费offset信息，可通过该拓扑命名;具体存储offset的位置，确定下次读取不重复的数据；
group.id=session-record-log-20211114-1

#--------------------------------topology配置------------------------------#

#consumer 并行度
source.parallelism=3

#转换函数并行度
transform.parallelism=3

#kafka producer 并行度
sink.parallelism=1

#数据中心，取值范围(0-31)
data.center.id.num=0

#hbase 更新时间，如填写0则不更新缓存
hbase.tick.tuple.freq.secs=180

#--------------------------------默认值配置------------------------------#

#0不需要补全原样输出日志，1需要补全
log.need.complete=1

#生产者压缩模式 none or snappy
producer.kafka.compression.type=none

