#--------------------------------nacos配置------------------------------#
#nacos 地址
nacos.server=192.168.44.12:8848

#nacos namespace
nacos.schema.namespace=test

#nacos topology_common_config.properties namespace
nacos.common.namespace=flink

#nacos data id
nacos.data.id=session_record.json

#--------------------------------Kafka消费/生产配置------------------------------#

#kafka 接收数据topic
source.kafka.topic=SESSION-RECORD

#补全数据 输出 topic
sink.kafka.topic=SESSION-RECORD-COMPLETED

#读取topic,存储该spout id的消费offset信息，可通过该拓扑命名;具体存储offset的位置，确定下次读取不重复的数据；
group.id=flinktest-1

#--------------------------------topology配置------------------------------#

#consumer 并行度
source.parallelism=9

#转换函数并行度
transform.parallelism=27

#kafka producer 并行度
sink.parallelism=9

#数据中心，取值范围(0-31)
data.center.id.num=0

#hbase 更新时间，如填写0则不更新缓存
hbase.tick.tuple.freq.secs=180

#--------------------------------默认值配置------------------------------#

#0不需要补全原样输出日志，1需要补全
log.need.complete=1

#生产者压缩模式 none or snappy
producer.kafka.compression.type=none