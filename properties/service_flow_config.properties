#--------------------------------地址配置------------------------------#
#管理kafka地址
source.kafka.servers=192.168.44.12:9094

#管理输出kafka地址
sink.kafka.servers=192.168.44.12:9094

#用于分配log_id、连接hbase的zookeeper地址
zookeeper.servers=192.168.44.12:2181

#hdfs地址用于获取定位库
hdfs.servers=192.168.40.151:9000,192.168.40.152:9000

#--------------------------------HTTP/定位库------------------------------#
#定位库存储文件系统类型，hdfs or local
#knowledgebase.file.storage.type=hdfs
knowledgebase.file.storage.type=local

#定位库地址，根据file.system.type配置填写对应地址路径。
knowledgebase.file.storage.path=D:\\workerspace\\dat\\test\\
#knowledgebase.file.storage.path=/knowledgebase/ETL-SESSION-RECORD-COMPLETED/

#从知识库元数据中需要获取的文件type列表，配置为空则不过滤type；优先级比name高
knowledgebase.type.list=ip_location,asn

#从知识库元数据中需要获取文件的name列表；配置为空则不过滤name
knowledgebase.name.list=ip_v4_built_in,ip_v6_built_in,ip_v4_user_defined,ip_v6_user_defined,asn_v4,asn_v6

#工具库地址，存放秘钥文件等。
tools.library=D:\\workerspace\\dat\\test\\

#--------------------------------nacos配置------------------------------#
#nacos 地址
nacos.server=192.168.44.12:8848

#schema namespace名称
nacos.schema.namespace=prod

#schema data id名称
nacos.schema.data.id=session_record.json

#--------------------------------Kafka消费/生产配置------------------------------#
#kafka 接收数据topic
source.kafka.topic=etl-test

#补全数据 输出 topic
sink.kafka.topic=etl-test-result

#读取topic,存储该spout id的消费offset信息，可通过该拓扑命名;具体存储offset的位置，确定下次读取不重复的数据；
group.id=session-record-log-20211114-1

#--------------------------------topology配置------------------------------#

#consumer 并行度
source.parallelism=1

#转换函数并行度
transform.parallelism=1

#kafka producer 并行度
sink.parallelism=1

#数据中心，取值范围(0-31)
data.center.id.num=0

#hbase 更新时间，如填写0则不更新缓存
hbase.tick.tuple.freq.secs=180

#--------------------------------默认值配置------------------------------#

#0不需要补全原样输出日志，1需要补全
log.need.complete=1

#生产者压缩模式 none or snappy
producer.kafka.compression.type=none

